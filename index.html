<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ArDiRec — COMTRADE Workstation</title>
  <meta name="description" content="ArDiRec (Ari Disturbance Recorder) is an open-source, vendor-neutral COMTRADE workstation for protection and disturbance engineers.">
  <meta name="theme-color" content="#eef0f2">
  <link rel="icon" href="icon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
  <link rel="manifest" href="icon/site.webmanifest">
  <meta property="og:title" content="ArDiRec — COMTRADE Workstation">
  <meta property="og:description" content="Open any disturbance record. Understand it immediately.">
  <meta property="og:image" content="https://raw.githubusercontent.com/masarray/ardirec/main/icon/android-chrome-512x512.png">
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eef0f2; color: #17212a; display: grid; place-items: center; }
    main { width: min(920px, calc(100% - 40px)); padding: 56px 0; text-align: center; }
    .logo { width: 150px; height: 150px; object-fit: contain; filter: drop-shadow(0 14px 26px rgba(20,31,42,.14)); }
    h1 { margin: 24px 0 8px; font-size: clamp(2.4rem, 7vw, 4.8rem); letter-spacing: -.045em; }
    .tagline { margin: 0 auto; max-width: 720px; color: #52616d; font-size: clamp(1.05rem, 2.4vw, 1.35rem); line-height: 1.55; }
    .actions { margin-top: 32px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    a { color: inherit; }
    .button { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 8px; text-decoration: none; font-weight: 650; border: 1px solid #aeb8c0; background: #fff; }
    .button.primary { background: #17212a; color: #fff; border-color: #17212a; }
    .meta { margin-top: 42px; color: #74808a; font-size: .9rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #11171c; color: #edf2f6; }
      .tagline, .meta { color: #9daab4; }
      .button { background: #1b252d; border-color: #3b4852; }
      .button.primary { background: #edf2f6; color: #11171c; border-color: #edf2f6; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icon/android-chrome-512x512.png" alt="ArDiRec">
    <h1>ArDiRec</h1>
    <p class="tagline">ArDiRec (Ari Disturbance Recorder) is an open-source, vendor-neutral COMTRADE workstation for protection and disturbance engineers. Open any disturbance record. Understand it immediately.</p>
    <div class="actions">
      <a class="button primary" href="https://github.com/masarray/ardirec/releases">Downloads</a>
      <a class="button" href="https://github.com/masarray/ardirec">Source on GitHub</a>
      <a class="button" href="https://github.com/masarray/ardirec#build">Build</a>
    </div>
    <p class="meta">Qt Quick · C++20 · COMTRADE · GPL-3.0-or-later</p>
  </main>
</body>
</html>
