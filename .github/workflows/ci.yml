name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce performance architecture
        run: python3 scripts/check_performance_contract.py

  recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce recovery correctness guards
        run: python3 scripts/check_recovery_contract.py
      - name: Enforce R2 workstation lifecycle guards
        run: python3 scripts/check_r2_workstation_contract.py
      - name: Enforce R3 internal MDI guards
        run: python3 scripts/check_r3_mdi_contract.py
      - name: Enforce R4 recovery Definition of Done
        run: python3 scripts/check_r4_definition_of_done.py
      - name: Enforce R5 release-quality contract state
        run: python3 scripts/check_r5_release_contract.py
      - name: Enforce R6 release-ready workspace / Phasor contracts
        run: python3 scripts/check_r6_workspace_contract.py --require-release-ready

  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DARDIREC_BUILD_DESKTOP=OFF -DARDIREC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  large-record-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure benchmark
        run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DARDIREC_BUILD_DESKTOP=OFF -DARDIREC_BUILD_BRIDGE=OFF -DARDIREC_BUILD_TESTS=OFF -DARDIREC_BUILD_BENCHMARKS=ON
      - name: Build benchmark
        run: cmake --build build-bench --target ardirec-large-record-benchmark --parallel 2
      - name: Exercise 10M-sample / ~210 MiB record
        run: ./build-bench/benchmarks/ardirec-large-record-benchmark --samples 10000000 --analog 6 --digital 8 --sample-rate 10000
      - name: Exercise 120-channel / ~238 MiB record
        run: ./build-bench/benchmarks/ardirec-large-record-benchmark --samples 1000000 --analog 120 --digital 8 --sample-rate 10000

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DARDIREC_BUILD_DESKTOP=ON -DARDIREC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
