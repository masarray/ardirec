name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DARDIREC_BUILD_DESKTOP=OFF -DARDIREC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  large-record-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure benchmark
        run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DARDIREC_BUILD_DESKTOP=OFF -DARDIREC_BUILD_BRIDGE=OFF -DARDIREC_BUILD_TESTS=OFF -DARDIREC_BUILD_BENCHMARKS=ON
      - name: Build benchmark
        run: cmake --build build-bench --target ardirec-large-record-benchmark --parallel 2
      - name: Exercise 10M-sample / ~210 MiB record
        run: ./build-bench/benchmarks/ardirec-large-record-benchmark --samples 10000000 --analog 6 --digital 8 --sample-rate 10000

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DARDIREC_BUILD_DESKTOP=ON -DARDIREC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
