name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    # Pin to VS 2022 to match the Qt MSVC 2022 binary package.
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read canonical release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { throw 'VERSION must not be empty' }
          "ARDIREC_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release version: $version"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: R5.5 repeated interaction and lifecycle stress
        shell: pwsh
        run: >-
          ctest --test-dir build -C Release --output-on-failure --repeat until-fail:3
          -R 'ardirec_(document_lifecycle_tests|r4_qml_runtime_tests|r5_linked_cursor_tests|r5_phasor_zero_flicker_tests|r5_table_zero_flicker_tests|r5_locus_parity_tests)'

      - name: Stage Qt application and VC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = "ardirec-v$env:ARDIREC_RELEASE_VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio C++ installation not found" }

          $redistRoot = Join-Path $vsPath 'VC\Redist\MSVC'
          $crtDir = Get-ChildItem $redistRoot -Directory -Recurse |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC14\d\.CRT$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $crtDir) { throw "x64 Microsoft VC runtime directory not found under $redistRoot" }

          Copy-Item (Join-Path $crtDir.FullName '*.dll') $folder -Force

          $requiredRuntime = @(
            'MSVCP140.dll',
            'MSVCP140_1.dll',
            'MSVCP140_2.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          )
          foreach ($dll in $requiredRuntime) {
            if (-not (Test-Path (Join-Path $folder $dll))) {
              throw "Portable runtime validation failed: missing $dll"
            }
          }

      - name: Smoke test packaged application startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Resolve-Path "ardirec-v$env:ARDIREC_RELEASE_VERSION-windows-x64"
          $exe = Join-Path $folder 'ardirec.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'ardirec-release-startup.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'ardirec-release-startup.stderr.log'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Packaged release executable exited during startup smoke with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = "ardirec-v$env:ARDIREC_RELEASE_VERSION-windows-x64"
          $zip = "ardirec-v$env:ARDIREC_RELEASE_VERSION-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.ARDIREC_RELEASE_VERSION }}
          name: ArDiRec v${{ env.ARDIREC_RELEASE_VERSION }} — R5.5 qualification candidate
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            R5.5 qualification candidate after linked local cursors, Phasor zero-flicker,
            Table zero-flicker and SIGRA-oriented Locus parity recovery.

            This candidate must pass the documented manual Windows/SIGRA comparison
            before the project is promoted to 0.2.0-rc.1.

            Windows development distribution remains a portable ZIP folder. The
            executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v${{ env.ARDIREC_RELEASE_VERSION }}-windows-x64-portable.zip
            SHA256SUMS.txt
