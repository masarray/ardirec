name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.6-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.6-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.6-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.6
          name: ardirec v0.2.0-alpha.6 — Synchronized Analysis Views
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ardirec alpha.6 starts the transition from a waveform-only viewer into a synchronized disturbance-analysis workstation.

            Highlights:
            - Standard phase colors are now shared by voltage and current: L1 red, L2 yellow, L3 blue, E/N green.
            - The COMTRADE trigger is a muted dashed fixed reference instead of looking like a draggable measurement cursor.
            - Time Signals can toggle between recorded sinusoidal samples and one-cycle sliding RMS traces.
            - New Phasor view shows synchronized voltage/current fundamental vectors using a full-cycle DFT.
            - New Locus view plots phase V/I trajectories in the R-X plane with C1/C2 markers. This is intentionally labeled as raw phase impedance; protection-loop compensation and RIO/XRIO zones come in the protection-analysis gate.
            - New Harmonics view shows full-cycle DFT harmonic RMS magnitudes as percent of the fundamental.
            - New Value Table view shows cursor-synchronized instantaneous, RMS and phasor-angle values.
            - A common cursor navigator stays available in every view. C1/C2 still snap to digital transitions, so moving a cursor immediately updates phasor, locus, harmonics and table results.
            - Windows development distribution remains a portable ZIP folder.

            Alpha limitation: loading is still capped at 500,000 sample frames while memory-mapped SignalStore/LOD work continues. The current DFT/RMS implementation is the first deterministic analysis core and will be expanded with symmetrical components, power/frequency, RIO/XRIO and calculation-validation fixtures.

            The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.6-windows-x64-portable.zip
            SHA256SUMS.txt
