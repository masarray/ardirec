name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.8-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.8-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.8-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.8
          name: ardirec v0.2.0-alpha.8 — Stacked Harmonic Analysis
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ardirec alpha.8 delivers the P1 harmonic-analysis workflow on top of the P0 investigation foundation.

            Highlights:
            - Harmonics is now a stacked engineering workspace instead of a single-channel proof chart.
            - Selecting a Voltage or Current measuring signal automatically presents mapped L1/L2/L3/E spectra together for fast phase comparison.
            - C1 and C2 are visible simultaneously in every harmonic row; the active cursor uses the solid treatment while the comparison remains visible without losing phase-color identity.
            - Each signal has a compact summary rail with H1 RMS, THD and dominant non-fundamental harmonic for both cursors.
            - Distortion plots focus on H2..Hn so useful harmonic detail is not flattened by the always-100% fundamental reference.
            - Display can switch between relative %H1 and absolute RMS engineering units.
            - Harmonic-order presets cover H15, H25 and H50.
            - A new pure C++ harmonic-spectrum engine computes all requested orders from one one-cycle sample window using a complex recurrence, replacing repeated per-order window scans.
            - Deterministic tests validate a known H1=100 RMS, H3=10 RMS, H5=5 RMS waveform with THD=11.1803398875%, clean-sine near-zero THD, and isolated non-finite sample handling.
            - Primary/Secondary representation from alpha.7 continues to scale absolute harmonic magnitudes while %H1 and THD remain invariant.

            Windows development distribution remains a portable ZIP folder. The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.8-windows-x64-portable.zip
            SHA256SUMS.txt
