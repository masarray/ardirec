name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.10-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.10-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.10-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.10
          name: ardirec v0.2.0-alpha.10 — Harmonics Workstation
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ardirec alpha.10 upgrades Harmonics from a role-switched proof view into a dense full-record investigation workspace.

            Highlights:
            - Harmonics now defaults to all recognized Voltage + Current analog signals in one vertically scrollable workspace; no measuring-signal switch is required to reveal Current after Voltage.
            - Harmonics uses one dedicated analysis cursor only. Time/Phasor/Locus/Table retain dual C1/C2 workflows.
            - The single Harmonic Cursor keeps the same shared timebase and digital-edge snapping behavior.
            - Full spectrum mode now shows H0/DC, H1 fundamental and H2..Hn. Distortion-only H2..Hn remains available as an optional view.
            - H0/DC is calculated as the arithmetic mean of the same one-cycle trailing window and is never multiplied by sqrt(2).
            - Compact 128 px virtualized rows expose substantially more signals per screen and keep large analog records responsive while scrolling.
            - Direct bar annotations show %H1 and engineering magnitude when spacing permits; hover reveals order, frequency, magnitude, %H1 and phase.
            - Scope controls provide Electrical, Voltage, Current, Visible and All Analog views.
            - H10/H15/H25/H50 and %H1/RMS controls remain available without changing the cursor or scroll context.
            - Cached harmonic snapshots avoid recomputing spectra merely because a row scrolls out and back into view.
            - Primary/Secondary continues to scale absolute magnitudes while %H1 and THD remain invariant.
            - Core regression tests now validate a known DC + H1 + H2 waveform and confirm DC is excluded from THD.

            Windows development distribution remains a portable ZIP folder. The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.10-windows-x64-portable.zip
            SHA256SUMS.txt
