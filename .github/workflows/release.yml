name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.5-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.5-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.5-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.5
          name: ardirec v0.2.0-alpha.5 — Portable ZIP Development Build
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Development distribution policy update for ardirec.

            Windows alpha/beta builds now ship as a transparent portable ZIP folder instead of a self-extracting EXE. This keeps the development workflow fast, makes the Qt runtime layout explicit, and avoids confusing a self-extracting bundle with a true monolithic executable.

            Usage:
            1. Download `ardirec-v0.2.0-alpha.5-windows-x64-portable.zip`.
            2. Extract the folder anywhere.
            3. Run `ardirec.exe` inside the extracted folder.

            The application remains fully portable: no installer is required and no installation is written to Windows. A proper installer will be introduced closer to stable/final releases.

            This build retains the alpha.4 cursor improvements, including horizontal-resize hover feedback and snapping Cursor 1 / Cursor 2 to rising and falling COMTRADE digital transitions.

            Alpha limitation: loading is still capped at 500,000 sample frames while the memory-mapped SignalStore and persistent LOD cache are being completed. RMS/phasor/vector/R-X/harmonics remain later gates.

            The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.5-windows-x64-portable.zip
            SHA256SUMS.txt
