name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.12-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.12-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.12-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.12
          name: ardirec v0.2.0-alpha.12 — Calculation Parity Hotfix
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            alpha.12 is a calculation-parity hotfix driven by a side-by-side check against the SIGRA line1.CFG sample at the same trigger cursor.

            What the audit proved:
            - COMTRADE decoding/scaling was already sound: H1 RMS and H2/H3/H5 ratios matched the reference values.
            - Phase-angle presentation used the wrong reference convention.
            - Table Extremum used max-absolute-in-cycle instead of the last completed turning point.
            - Compact DC was shown as absolute V/A while the reference table was configured for DC percent of H1.
            - THD could be grossly inflated when a user requested harmonic orders above the record Nyquist limit.

            Fixes:
            - Phase is now sine-wave phase position at the cursor/reference instant for Table/Harmonics and the vector display.
            - Harmonic requests are automatically clipped to the physically resolvable Nyquist order. A 1 kHz / 50 Hz record stops at H10, so aliased H11+ can no longer be double-counted in THD.
            - Table uses Last extremum semantics: the latest completed local max/min before the cursor.
            - Default Table DC presentation is percent of H1; signed absolute DC remains available in Detailed mode.
            - Table exposes the sample rate and actual THD harmonic limit for auditability.
            - Deterministic tests cover phase reference, Nyquist clipping, alias-safe THD and last-extreme selection.

            Windows development distribution remains a portable ZIP folder. The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.12-windows-x64-portable.zip
            SHA256SUMS.txt
