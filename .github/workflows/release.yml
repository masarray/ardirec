name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.9-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.9-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.9-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.9
          name: ardirec v0.2.0-alpha.9 — Protection Distance Locus
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ardirec alpha.9 delivers the P2 manual distance-protection analysis foundation.

            Highlights:
            - Locus now uses explicit protection measuring loops: L1-E, L2-E, L3-E, L1-L2, L2-L3 and L3-L1.
            - Phase-phase loops use differential voltage/current; phase-earth loops support complex residual-current grounding compensation kL.
            - kL can be entered manually or imported from RIO/XRIO KL, Z0/Z1, or RE/RL-XE/XL settings where available.
            - C1 and C2 remain synchronized with the shared investigation context and are displayed as filled/outlined impedance markers.
            - The selected Time-view window drives the R-X trajectory, keeping fault timing and impedance behavior aligned.
            - Classic RIO distance zones are imported with fault-loop filtering, trip metadata and supported generic polygon/mho geometry.
            - Standardized XRIO RIO Distance sections are adapted without evaluating vendor-specific Custom formulas/scripts; unsupported content is reported explicitly.
            - Imported zone impedance bases follow the global Primary/Secondary representation when CT/VT metadata permits verified conversion.
            - Pure C++ distance and RIO seams have deterministic regression tests for LL/LN loop equations, complex kL conversion, RIO geometry/filtering and XRIO adaptation.

            P2 is manual analysis infrastructure, not automatic fault classification or distance-to-fault estimation. Unsupported proprietary XRIO converter logic is never guessed.

            Windows development distribution remains a portable ZIP folder. The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.9-windows-x64-portable.zip
            SHA256SUMS.txt
