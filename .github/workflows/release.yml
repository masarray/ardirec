name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.11-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.11-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.11-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.11
          name: ardirec v0.2.0-alpha.11 — Engineering Table Workstation
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ardirec alpha.11 turns Table into a dense single-cursor engineering snapshot workspace.

            Highlights:
            - Table now uses one dedicated shared cursor, matching the fast point-in-time analysis workflow while Time/Phasor/Locus retain dual C1/C2 measurement workflows.
            - Default Electrical scope shows all recognized Voltage + Current channels without relying on Time-view visibility.
            - Each row exposes Instantaneous, true one-cycle RMS, H1 fundamental RMS, H1 phase angle, signed cycle extremum, signed DC, THD, H2/H1, H3/H1 and H5/H1.
            - Scope controls provide Electrical, Voltage, Current, Visible and All Analog views.
            - Sort controls provide Record, Signal, RMS descending and THD descending workflows without moving the cursor.
            - A compact summary strip immediately surfaces the highest-THD channel and strongest-RMS channel at the selected time.
            - THD >= 5% receives a restrained engineering highlight; phase identity remains a thin color strip rather than full-row coloring.
            - Rows are virtualized and engineering snapshots are cached by channel/cursor/representation so scrolling does not repeat unchanged DFT/RMS work.
            - Primary/Secondary scales all absolute quantities while phase angle, THD and harmonic ratios remain invariant.
            - Table cursor keeps the common timebase and digital-edge snapping behavior.

            Windows development distribution remains a portable ZIP folder. The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.11-windows-x64-portable.zip
            SHA256SUMS.txt
