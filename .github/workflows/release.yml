name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.14-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.14-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.14-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.14
          name: ardirec v0.2.0-alpha.14 — Table UX Finalization
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            alpha.14 finalizes the Engineering Table UX after alpha.13 achieved numerical parity with the SIGRA line1.CFG reference.

            Table UX changes:
            - Record sorting now preserves the actual COMTRADE CFG analog-channel order instead of silently grouping voltage before current.
            - Table-specific top chrome is collapsed so more engineering rows remain visible while Open, Signals, view switching and Primary/Secondary remain accessible.
            - Analysis rows are denser and use one-decimal percentages for fast scanning; Detailed mode and hover tooltips preserve additional precision.
            - Column semantics are explicit: DC/H1 and THD H2-Hn make the percentage reference and Nyquist-safe THD range unambiguous.
            - Abnormal investigation cues use restrained amber markers instead of large filled warning cells; they remain heuristics, not relay-operate verdicts.
            - Summary wording is more direct: Worst THD, Highest DC/H1, Max V RMS and Max I RMS.
            - Detailed mode keeps nearest sample, true RMS, crest factor and signed DC without changing the single-cursor investigation context.

            Calculation behavior from alpha.13 is intentionally unchanged: cursor-referenced phase, Last extremum, DC/H1, Nyquist-safe harmonics and THD remain the validated baseline.

            Windows development distribution remains a portable ZIP folder. The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.14-windows-x64-portable.zip
            SHA256SUMS.txt
