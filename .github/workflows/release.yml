name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.7-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.7-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.7-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.7
          name: ardirec v0.2.0-alpha.7 — P0 Analysis Workflow
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ardirec alpha.7 hardens the primary fault-record investigation workflow.

            Highlights:
            - Global Secondary / Primary value representation based on COMTRADE analog primary, secondary and P/S metadata.
            - One conversion policy is shared by waveform values/axes, one-cycle RMS, phasors, harmonic absolute magnitudes, value table and raw R-X impedance.
            - Stored COMTRADE samples remain immutable; missing/invalid CT/PT ratios fall back safely to 1:1 and are surfaced in the UI.
            - Primary/Secondary switching preserves the investigation state: time zoom/pan, vertical signal stack, selected channels, C1/C2 and digital-edge snap positions do not reset.
            - Representation switching is O(1) for waveform/RMS caches; it changes a display scale and repaints instead of rebuilding large sample/RMS arrays on the UI thread.
            - Instant and RMS modes share the exact same timebase and disturbance stack.
            - Compact cursor header now shows C1, C2, C2-C1 and C2+C1 with simultaneous Instantaneous and RMS values.
            - Record summary now includes the active value representation and available CT/PT ratio metadata.
            - Existing phase colors, fixed muted trigger reference, Phasor, Harmonics, Locus and Table views remain synchronized with the same investigation context.

            This is the P0 workflow slice. Stacked multi-signal harmonic diagrams are P1; compensated protection-loop/RIO-XRIO locus redesign is P2.

            Windows development distribution remains a portable ZIP folder. The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.7-windows-x64-portable.zip
            SHA256SUMS.txt
