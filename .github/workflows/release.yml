name: Release Portable ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application
        shell: pwsh
        run: |
          $folder = 'ardirec-v0.2.0-alpha.12-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.12-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.12-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash + '  ' + $zip | Set-Content SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha.12
          name: ardirec v0.2.0-alpha.12 — Table Investigation Polish
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            ardirec alpha.12 sharpens the Engineering Table into an abnormal-first investigation surface.

            Highlights:
            - Compact Analysis columns prioritize H1 RMS/angle, cycle extremum, DC/H1, THD and H2/H3/H5 ratios; Detailed mode adds Instant, true RMS, crest factor and signed DC.
            - Only abnormal filters channels using transparent investigation heuristics: THD >= 5%, |DC|/H1 >= 5%, or crest factor >= 2.0. These are not standards or relay-operate verdicts.
            - New sort modes rank DC bias and crest factor in addition to Record, Signal, RMS and THD.
            - Summary strip reports abnormal count, worst THD, strongest DC bias and highest crest factor while retaining dimension-safe Max V/Max I summaries.
            - Clicking a row selects that signal in the shared document context, so analysis can continue in other views without hunting for the channel again.
            - Table remains single-cursor, snap-capable, cached, virtualized and Primary/Secondary aware.

            Windows development distribution remains a portable ZIP folder. The executable is unsigned, so Windows SmartScreen may show a warning.
          files: |
            ardirec-v0.2.0-alpha.12-windows-x64-portable.zip
            SHA256SUMS.txt
