name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    # Keep the compiler aligned with the Qt package below. Using windows-latest
    # currently selects VS 2026 while Qt is the MSVC 2022 build, which can leave
    # the portable folder without the VC runtime DLLs needed on a clean PC.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DARDIREC_BUILD_DESKTOP=ON
          -DARDIREC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Qt application and VC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.14-windows-x64'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item build/apps/desktop/Release/ardirec.exe "$folder/ardirec.exe"
          windeployqt --release --compiler-runtime --no-translations --qmldir apps/desktop/qml "$folder/ardirec.exe"

          # windeployqt may not copy the MSVC runtime on hosted runners. Make the
          # portable ZIP genuinely self-contained by copying the x64 VC runtime
          # from the VS 2022 redist directory explicitly.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsPath) { throw "Visual Studio C++ installation not found" }

          $redistRoot = Join-Path $vsPath 'VC\Redist\MSVC'
          $crtDir = Get-ChildItem $redistRoot -Directory -Recurse |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC14\d\.CRT$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $crtDir) { throw "x64 Microsoft VC runtime directory not found under $redistRoot" }

          Copy-Item (Join-Path $crtDir.FullName '*.dll') $folder -Force

          $requiredRuntime = @(
            'MSVCP140.dll',
            'MSVCP140_1.dll',
            'MSVCP140_2.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          )
          foreach ($dll in $requiredRuntime) {
            if (-not (Test-Path (Join-Path $folder $dll))) {
              throw "Portable runtime validation failed: missing $dll"
            }
          }
          Write-Host "VC runtime staged from: $($crtDir.FullName)"
          Get-ChildItem $folder -Filter '*140*.dll' | Select-Object Name, Length

      - name: Smoke test packaged application startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Resolve-Path 'ardirec-v0.2.0-alpha.14-windows-x64'
          $exe = Join-Path $folder 'ardirec.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'ardirec-startup.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'ardirec-startup.stderr.log'

          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_LOGGING_TO_CONSOLE = '1'
          $process = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            Write-Host "ardirec.exe exited during startup smoke test with code $($process.ExitCode)"
            if (Test-Path $stdout) { Write-Host '--- stdout ---'; Get-Content $stdout }
            if (Test-Path $stderr) { Write-Host '--- stderr ---'; Get-Content $stderr }
            throw 'Packaged ardirec.exe did not stay alive for 5 seconds.'
          }

          Stop-Process -Id $process.Id -Force
          Write-Host 'Packaged ardirec.exe startup smoke test passed.'
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'ardirec-v0.2.0-alpha.14-windows-x64'
          $zip = 'ardirec-v0.2.0-alpha.14-windows-x64-portable.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ardirec-windows-x64-portable-zip
          path: ardirec-v0.2.0-alpha.14-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
