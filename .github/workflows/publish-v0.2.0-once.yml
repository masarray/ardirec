name: Publish ArDiRec v0.2.0 Stable Once

on:
  push:
    branches: [main]
    paths:
      - 'release-approval/v0.2.0.txt'

permissions:
  contents: read

concurrency:
  group: ardirec-one-shot-v0.2.0-stable
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable stable identity and R5 / R6 gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Only approved stable SemVer versions are permitted: $version" }
          if ($version -ne '0.2.0') { throw 'One-shot release is locked to VERSION 0.2.0' }
          $approval = (Get-Content release-approval/v0.2.0.txt -Raw).Trim()
          if ($approval -ne 'APPROVE_PUBLIC_STABLE_RELEASE_v0.2.0') { throw 'Missing explicit release approval marker' }
          $existing = & git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify existing tags' }
          if ($existing) { throw "Release tag v$version already exists: refusing overwrite" }
          python scripts/check_r5_release_contract.py --require-release-ready
          if ($LASTEXITCODE -ne 0) { throw 'R5 strict release gate failed' }
          python scripts/check_r5_release_qualification.py
          if ($LASTEXITCODE -ne 0) { throw 'R5.5 release qualification failed' }
          python scripts/check_r6_workspace_contract.py --require-release-ready
          if ($LASTEXITCODE -ne 0) { throw 'R6 strict release gate failed' }

  windows-installers:
    needs: preflight
    uses: ./.github/workflows/windows-build.yml
    with:
      release_lane: true
    permissions:
      contents: read

  linux-installers:
    needs: preflight
    uses: ./.github/workflows/linux-build.yml
    permissions:
      contents: read

  publish-stable:
    name: Publish both verified installer ZIPs as public Stable
    needs: [preflight, windows-installers, linux-installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified installer artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: ardirec-*-installer-zip
          merge-multiple: true
          path: release-assets

      - name: Verify platform archives and record checksums
        shell: bash
        env:
          VERSION: 0.2.0
        run: |
          set -euo pipefail
          win="ArDiRec-v$VERSION-Windows-x64-Setup.zip"
          linux="ArDiRec-v$VERSION-Linux-x86_64-Setup.zip"
          cd release-assets
          test -s "$win" && test -s "$linux"
          unzip -t "$win"
          unzip -t "$linux"
          sha256sum "$win" "$linux" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Release tag already exists: refusing overwrite" >&2
            exit 1
          fi

      - name: Publish user-approved Stable with verified installers
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.0
          target_commitish: ${{ github.sha }}
          name: ArDiRec v0.2.0 — Windows and Linux installers
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ArDiRec v0.2.0 — user-approved first public Stable release.
            Focus: manual COMTRADE disturbance investigation, time signals, digital
            events, synchronized cursors, phasors, harmonics, impedance locus, and MDI.
            Windows: unzip and run Inno Setup. Linux: unzip, choose Debian installer
            or AppImage. Verify both ZIP files against SHA256SUMS.txt.
            Stable does not certify full reference or vendor-specific COMTRADE parity.
            Windows executable is unsigned and may trigger SmartScreen.
          files: |
            release-assets/ArDiRec-v0.2.0-Windows-x64-Setup.zip
            release-assets/ArDiRec-v0.2.0-Linux-x86_64-Setup.zip
            release-assets/SHA256SUMS.txt
