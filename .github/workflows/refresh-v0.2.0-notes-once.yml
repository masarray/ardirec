name: Refresh v0.2.0 public release notes once

on:
  push:
    branches: [main]
    paths:
      - release-maintenance/v0.2.0.txt

permissions:
  contents: write

concurrency:
  group: ardirec-v0.2.0-release-notes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicit release maintenance authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < release-maintenance/v0.2.0.txt)" = "APPROVE_REFRESH_v0.2.0_NOTES"
          test "$(tr -d '\r\n' < VERSION)" = "0.2.0"
      - name: Rewrite public v0.2.0 release notes without touching assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(gh release view v0.2.0 --json assets --jq '.assets[].name' | sort)"
          python3 - <<'PY'
          from pathlib import Path
          s = Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          root = "https://github.com/masarray/ardirec/blob/main/"
          for relative in ("docs/GETTING_STARTED.md", "docs/COMTRADE_COMPATIBILITY.md", "CHANGELOG.md"):
              s = s.replace("](" + relative + ")", "](" + root + relative + ")")
          Path("/tmp/ardirec-v0.2.0-release-notes.md").write_text(s, encoding="utf-8")
          PY
          gh release edit v0.2.0 --title "ArDiRec v0.2.0 — Stable" --notes-file /tmp/ardirec-v0.2.0-release-notes.md
          after="$(gh release view v0.2.0 --json assets --jq '.assets[].name' | sort)"
          test "$before" = "$after"
          gh release view v0.2.0 --json tagName,isDraft,isPrerelease,name,assets --jq '{tag:.tagName,draft:.isDraft,prerelease:.isPrerelease,title:.name,assets:[.assets[].name]}'
