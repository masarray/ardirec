name: Patch Locus startup regression

on:
  push:
    branches: [fix-windows-startup-regression]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-windows-startup-regression

      - name: Patch FINAL Item.transform collision
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/qml/LocusView.qml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'readonly property var transform: earthFamily ? root.earthPanelTransform : root.phasePanelTransform':
                  'readonly property var panelTransform: earthFamily ? root.earthPanelTransform : root.phasePanelTransform',
              'visible: root.loopVisible(loopId) && transform && transform.valid':
                  'visible: root.loopVisible(loopId) && panelTransform && panelTransform.valid',
              'plotTransform: parent.transform':
                  'plotTransform: parent.panelTransform',
          }

          expected = {key: (2 if key == 'plotTransform: parent.transform' else 1) for key in replacements}
          for old, new in replacements.items():
              count = text.count(old)
              if count != expected[old]:
                  raise SystemExit(f'Expected {expected[old]} occurrence(s) of {old!r}, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/qml/LocusView.qml
          git commit -m "Fix QML startup: avoid overriding Item.transform"
          git push origin HEAD:fix-windows-startup-regression
