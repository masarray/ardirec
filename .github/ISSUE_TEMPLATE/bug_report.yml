name: Bug report
description: Report a reproducible issue in ArDiRec
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: ArDiRec version
      placeholder: "v0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10/11 x64
        - Linux x86_64
        - Source build / other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and where it appears.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the shortest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: COMTRADE context and diagnostics
      description: Include revision, DAT type, channel counts, nominal frequency, and relevant warnings when applicable. Redact sensitive values.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data privacy
      options:
        - label: I have checked that any files, screenshots, or records I attach can be shared publicly.
          required: true
